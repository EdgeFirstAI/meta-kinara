# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/packagegroups/*.bb"

# Appends to NXP's ARA-2 packaging live under dynamic-layers and are parsed
# only when meta-imx-ml is in the build. A .bbappend with no matching recipe
# is a parse error, so placing them in recipes-* would break every build
# without that layer -- Torizon among them.
BBFILES_DYNAMIC += " \
    imx-machine-learning:${LAYERDIR}/dynamic-layers/imx-machine-learning/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-kinara"
BBFILE_PATTERN_meta-kinara = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-kinara = "10"

LAYERDEPENDS_meta-kinara = "core"
LAYERSERIES_COMPAT_meta-kinara = "kirkstone scarthgap walnascar whinlatter"

# Include Kinara -dev/-staticdev packages in the SDK toolchain
TOOLCHAIN_TARGET_TASK:append = " packagegroup-kinara-sdk"

# Kinara SDK download mirror. Set in local.conf to the base URL
# provided by Kinara for NDA-licensed runtime packages, e.g.:
#   KINARA_MIRROR = "https://your-mirror.example.com/kinara"
KINARA_MIRROR ?= "https://KINARA_MIRROR_NOT_SET.invalid"

# Which ARA-2 runtime the image installs. The two packagings cannot be
# installed together: they ship different DVAPI generations, configure
# different proxy sockets, and a client of one cannot drive the other's
# proxy -- it connects, then hangs on the first call. Set in local.conf:
#
#   KINARA_ARA2_PROVIDER = "nxp"      # NXP imx-nxp-ara2 (default)
#   KINARA_ARA2_PROVIDER = "kinara"   # this layer's ara2 recipe
#
# "nxp" requires meta-imx-ml; a build without that layer falls back to
# "kinara", which is the only provider available there.
KINARA_ARA2_PROVIDER ??= "nxp"

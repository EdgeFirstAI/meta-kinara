# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/packagegroups/*.bb"

# Appends to NXP recipes (imx-nxp-ara2, uiodma) live under dynamic-layers
# and are parsed only when meta-imx-ml is in the build. A .bbappend with no
# matching recipe is a parse error, so placing them in recipes-* would break
# every build without that layer -- Torizon among them.
BBFILES_DYNAMIC += " \
    imx-machine-learning:${LAYERDIR}/dynamic-layers/imx-machine-learning/recipes-*/*/*.bbappend \
"

# meta-imx-ml gained imx-nxp-ara2 and uiodma with the wrynose BSP. On these
# earlier releases the layer is present without them, so the appends are
# masked and the Kinara SDK imx-nxp-ara2 does not defer to NXP's.
# LAYERSERIES_CORENAMES is not yet set while this file is parsed, so only
# LAYERDIR is expanded immediately and the mask is resolved later.
KINARA_NO_NXP_ARA2_SERIES = "kirkstone scarthgap walnascar whinlatter"
KINARA_LAYERDIR := "${LAYERDIR}"
BBMASK += "${@'${KINARA_LAYERDIR}/dynamic-layers/imx-machine-learning/' if bb.utils.filter('LAYERSERIES_CORENAMES', d.getVar('KINARA_NO_NXP_ARA2_SERIES'), d) else ''}"

# recipes-nxp-backport carries NXP's own Ara-2 recipes for the releases whose
# meta-imx-ml has none, so a build without NDA mirror access still has a
# runtime. Mask it wherever meta-imx-ml provides them already, and wherever
# meta-imx-bsp is absent, since those recipes inherit its fsl-eula2 classes.
BBMASK += "${@'' if (bb.utils.filter('LAYERSERIES_CORENAMES', d.getVar('KINARA_NO_NXP_ARA2_SERIES'), d) and bb.utils.filter('BBFILE_COLLECTIONS', 'fsl-bsp-release', d)) else '${KINARA_LAYERDIR}/recipes-nxp-backport/'}"

# Which packaging imx-nxp-ara2 resolves to: "nxp" for NXP's rt-sdk-ara2, from
# meta-imx-ml or recipes-nxp-backport, "kinara" for this layer's Kinara SDK
# recipe. Read-only; consumers that only work with one runtime (such as
# meta-edgefirst's nnstreamer-ara2) test it.
#
# An explicit selection wins, and Kinara SDK releases are 1.x while NXP's
# packaging is 2.x onwards, so a 1.x PREFERRED_VERSION names the Kinara SDK
# and any other names NXP's. With nothing pinned, NXP's packaging is used
# wherever meta-imx-ml ships it; the backport is never selected implicitly,
# because it carries DEFAULT_PREFERENCE = "-1".
KINARA_ARA2_PREFERRED_VERSION = "${@d.getVar('PREFERRED_VERSION_imx-nxp-ara2') or ''}"
KINARA_ARA2_NXP_FROM_IMX_ML = "${@'1' if bb.utils.filter('BBFILE_COLLECTIONS', 'imx-machine-learning', d) and not bb.utils.filter('LAYERSERIES_CORENAMES', d.getVar('KINARA_NO_NXP_ARA2_SERIES'), d) else ''}"
KINARA_ARA2_RUNTIME = "${@'kinara' if d.getVar('KINARA_ARA2_PREFERRED_VERSION').startswith('1.') else ('nxp' if (d.getVar('KINARA_ARA2_PREFERRED_VERSION') or d.getVar('KINARA_ARA2_NXP_FROM_IMX_ML')) else 'kinara')}"

BBFILE_COLLECTIONS += "meta-kinara"
BBFILE_PATTERN_meta-kinara = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-kinara = "10"

LAYERDEPENDS_meta-kinara = "core"
LAYERSERIES_COMPAT_meta-kinara = "kirkstone scarthgap walnascar whinlatter wrynose"

# Include Kinara -dev/-staticdev packages in the SDK toolchain
TOOLCHAIN_TARGET_TASK:append = " packagegroup-kinara-sdk"

# Kinara SDK download mirror. Set in local.conf to the base URL
# provided by Kinara for NDA-licensed runtime packages, e.g.:
#   KINARA_MIRROR = "https://your-mirror.example.com/kinara"
KINARA_MIRROR ?= "https://KINARA_MIRROR_NOT_SET.invalid"
